name: Đóng gói File APK BOOKHAD (Android)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cài đặt Java JDK 17 cho Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Kiểm tra & cấu hình Android SDK (API 34)
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK: $SDK_DIR"
          test -d "$SDK_DIR" || { echo "Android SDK directory not found: $SDK_DIR"; exit 1; }
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER=""
          for candidate in \
            "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_DIR/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -n "$SDKMANAGER" ]; then
            echo "Found sdkmanager: $SDKMANAGER"
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --sdk_root="$SDK_DIR" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          else
            echo "sdkmanager not found; using preinstalled SDK packages"
            ls -la "$SDK_DIR/platforms" || true
          fi

      - name: Cài thư viện và build giao diện Web (dist)
        env:
          VITE_API_BASE_URL: ${{ vars.BOOKHAD_SERVER_URL || vars.LAZIREAD_SERVER_URL || '' }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          node -v
          npm -v
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build

      - name: Tạo dự án Android với Capacitor 6 & gắn biểu tượng BOOKHAD
        shell: bash
        env:
          CI: true
          CAPACITOR_TELEMETRY: '0'
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund @capacitor/core@6.2.3 @capacitor/cli@6.2.3 @capacitor/android@6.2.3
          rm -rf android
          npx cap add android
          npx cap sync android
          # Only replace existing PNG icons in density mipmap-* folders (NEVER touch mipmap-anydpi-v26 XML files!)
          if [ -f public/pwa-512x512.png ] && file public/pwa-512x512.png | grep -qi "PNG image data"; then
            for entry in "mdpi:48:108" "hdpi:72:162" "xhdpi:96:216" "xxhdpi:144:324" "xxxhdpi:192:432"; do
              density="${entry%%:*}"
              rest="${entry#*:}"
              icon_sz="${rest%%:*}"
              fg_sz="${rest#*:}"
              dir="android/app/src/main/res/mipmap-$density"
              if [ -d "$dir" ]; then
                if command -v convert >/dev/null 2>&1; then
                  if [ -f "$dir/ic_launcher.png" ]; then
                    convert public/pwa-512x512.png -resize "${icon_sz}x${icon_sz}" "PNG32:$dir/ic_launcher.png"
                  fi
                  if [ -f "$dir/ic_launcher_round.png" ]; then
                    convert public/pwa-512x512.png -resize "${icon_sz}x${icon_sz}" "PNG32:$dir/ic_launcher_round.png"
                  fi
                  if [ -f "$dir/ic_launcher_foreground.png" ]; then
                    convert public/pwa-512x512.png -resize "${fg_sz}x${fg_sz}" "PNG32:$dir/ic_launcher_foreground.png"
                  fi
                else
                  if [ -f "$dir/ic_launcher.png" ]; then
                    cp public/pwa-192x192.png "$dir/ic_launcher.png"
                  fi
                  if [ -f "$dir/ic_launcher_round.png" ]; then
                    cp public/pwa-192x192.png "$dir/ic_launcher_round.png"
                  fi
                  if [ -f "$dir/ic_launcher_foreground.png" ]; then
                    cp public/pwa-512x512.png "$dir/ic_launcher_foreground.png"
                  fi
                fi
              fi
            done
          fi
          # Ensure no stray PNGs ever exist inside mipmap-anydpi-v26 (prevents AAPT2 duplicate resource error)
          rm -f android/app/src/main/res/mipmap-anydpi-v26/*.png || true
          # Match adaptive icon background to BOOKHAD dark midnight palette
          if [ -f android/app/src/main/res/values/ic_launcher_background.xml ]; then
            sed -i 's/#[0-9A-Fa-f]\{6\}/#141824/g' android/app/src/main/res/values/ic_launcher_background.xml || true
          fi

      - name: Biên dịch file APK (Debug Test)
        working-directory: android
        run: |
          java -version
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK_DIR" > local.properties
          cat local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../BOOKHAD-Android.apk
          ls -lh ../BOOKHAD-Android.apk

      - name: Tải lên file APK vào GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BOOKHAD-Android-APK
          path: BOOKHAD-Android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Phát hành 1 file APK trực tiếp tại GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="File cài đặt Android .apk cho Samsung Galaxy S24 Ultra và các máy Android.
          - Tải trực tiếp file BOOKHAD-Android.apk bên dưới và mở để cài đặt.
          - Đọc EPUB/PDF, Nghe giọng thiết bị offline và Trình trộn âm thanh nền hoạt động ngoại tuyến mượt mà 120Hz.
          - Để dùng thêm AI TTS/Dịch/Quét Web & Quét Video thành EPUB bên trong file APK, nhập link máy chủ vào Cài đặt → Link Máy chủ AI."
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest BOOKHAD-Android.apk --clobber
          else
            gh release create apk-latest BOOKHAD-Android.apk \
              --title "BOOKHAD Android APK (Bản cài đặt trực tiếp)" \
              --notes "$NOTES"
          fi
