name: Đóng gói File APK LaziRead (Android)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cài đặt Java JDK 17 cho Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Thiết lập Android SDK
        uses: android-actions/setup-android@v3

      - name: Cài thư viện và build giao diện Web (dist)
        env:
          VITE_API_BASE_URL: ${{ vars.LAZIREAD_SERVER_URL || '' }}
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Tạo dự án Android với Capacitor 6
        env:
          CI: true
        run: |
          npm install --legacy-peer-deps @capacitor/core@6.2.3 @capacitor/cli@6.2.3 @capacitor/android@6.2.3
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Biên dịch file APK (Debug Test)
        working-directory: android
        run: |
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../LaziRead-S24Ultra.apk

      - name: Tải lên file APK vào GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LaziRead-S24Ultra-APK
          path: LaziRead-S24Ultra.apk
          retention-days: 30

      - name: Phát hành 1 file APK trực tiếp tại GitHub Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: apk-latest
          name: LaziRead Android APK (Bản cài đặt trực tiếp)
          body: |
            File cài đặt Android `.apk` cho Samsung Galaxy S24 Ultra và các máy Android.
            - Tải trực tiếp file `LaziRead-S24Ultra.apk` bên dưới và mở để cài đặt.
            - Đọc EPUB/PDF, Nghe giọng thiết bị offline và Trình trộn 20 âm thanh nền hoạt động hoàn toàn ngoại tuyến.
            - Để dùng thêm AI TTS/Dịch/Quét Web bên trong file APK, nhập link máy chủ đã Deploy vào mục **Cài đặt → Link Máy chủ AI**.
          files: LaziRead-S24Ultra.apk
          overwrite_files: true
